# Recorder services. One container per (venue, scope) so that a problem in one
# never interrupts the others.
#
#   MARKETREC_DATA_DIR  host directory for the data tree (default: ../data)
#   MARKETREC_UID_GID   uid:gid that owns the data files (default: 1000:1000)

name: recorder

x-recorder: &recorder
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: market-recorder
  restart: unless-stopped
  user: "${MARKETREC_UID_GID:-1000:1000}"
  volumes:
    - "${MARKETREC_DATA_DIR:-../data}:/data"
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  pm-crypto:
    <<: *recorder
    command: ["--min-free-gb", "5", "polymarket-clob"]
